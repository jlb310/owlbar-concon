<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0a07">
<title>Demo · Carta y pedidos online · OWL BAR</title>
<meta name="description" content="Demo de Spacehost para OWL BAR Concón: carta digital con disponibilidad, pedido online con seguimiento en vivo y hora prometida, avisos de atraso, y sus administradores.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  :root { --papel: #f6f3ec; --papel2: #eee9dc; --tinta: #17140f; --tenue: #6e675a; --linea: rgba(23, 20, 15, .14); --acento: #e30a7d; --barra: 64px; --oro: #c9a36a; --noche: #0d0a07; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--papel2); color: var(--tinta); font: 400 15px/1.5 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .demo { flex: none; position: relative; z-index: 2; display: flex; align-items: center; gap: 16px; min-height: var(--barra); padding: 10px clamp(12px, 3vw, 28px); background: var(--papel); border-bottom: 1px solid var(--linea); }
  .demo-marca { display: flex; align-items: center; gap: 10px; flex: none; text-decoration: none; color: inherit; }
  .demo-marca img { height: 18px; width: auto; display: block; }
  .demo-pill { font: 700 10px/1 'Inter', sans-serif; letter-spacing: .14em; color: #fff; background: var(--acento); padding: 5px 8px; border-radius: 999px; }
  .demo-botones { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
  .demo-botones::-webkit-scrollbar { display: none; }
  .demo-boton { flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 14px 6px 8px; border: 1px solid var(--linea); border-radius: 12px; background: #fff; text-align: left; transition: border-color .2s, background .2s; }
  .demo-boton:hover { border-color: var(--tinta); }
  .demo-boton[aria-current="page"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
  .demo-boton b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--papel2); color: var(--tinta); font: 800 13px 'Bricolage Grotesque', sans-serif; }
  .demo-boton[aria-current="page"] b { background: var(--acento); color: #fff; }
  .demo-boton span { display: grid; line-height: 1.2; }
  .demo-boton strong { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .demo-boton small { font-size: 11px; color: var(--tenue); white-space: nowrap; }
  .demo-boton[aria-current="page"] small { color: rgba(246, 243, 236, .7); }

  @media (max-width: 899px) {
    .demo { flex-wrap: wrap; gap: 8px; padding: 8px 10px; }
    .demo-botones { margin-left: 0; width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
    .demo-boton { flex-direction: column; gap: 3px; min-height: 52px; padding: 6px 2px; text-align: center; border-radius: 10px; }
    .demo-boton b { width: 22px; height: 22px; font-size: 12px; border-radius: 6px; }
    .demo-boton strong { font-size: 11px; white-space: normal; line-height: 1.15; }
    .demo-boton small, .demo-boton .largo { display: none; }
  }
  @media (min-width: 900px) { .demo-boton .corto { display: none; } }

  .escena { flex: 1; min-height: 0; position: relative; display: flex; }
  .escena iframe { border: 0; display: block; width: 100%; height: 100%; background: #fff; }

  /* Pantallas de cliente: en escritorio se ven dentro de un celular. */
  .lado { display: none; }
  @media (min-width: 900px) {
    .escena.cliente { align-items: center; justify-content: center; gap: 56px; padding: 24px; color: #f4efe6; background: radial-gradient(90% 80% at 20% 30%, #2a1f14, var(--noche) 70%); }
    .escena.cliente .telefono { flex: none; width: 390px; height: min(844px, 100%); border-radius: 46px; padding: 12px; background: #17140f; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .8), inset 0 0 0 2px #3a342b, 0 0 0 1px rgba(255, 255, 255, .08); }
    .escena.cliente iframe { border-radius: 34px; }
    .escena.cliente .lado { display: block; max-width: 340px; }
  }
  .telefono { width: 100%; height: 100%; }
  .lado .logo-owl { display: inline-flex; align-items: center; gap: 12px; font: 700 13px/1 'Inter', sans-serif; letter-spacing: .32em; color: #efe6d6; margin-bottom: 22px; }
  .lado .logo-owl em { font-style: normal; color: var(--oro); }
  .lado .logo-owl .buho { width: 34px; height: 34px; color: var(--oro); }
  .lado .eti { font: 600 11px/1 'Inter', sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--oro); }
  .lado h1 { font: 600 40px/1.02 'Cormorant Garamond', serif; margin: 14px 0 12px; }
  .lado p { color: #b8aa94; }
  .lado ul { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .lado li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 14px; }
  .lado li::before { content: '✓'; color: var(--oro); font-weight: 700; }
  .lado .qr { margin-top: 22px; display: flex; gap: 14px; align-items: center; font-size: 13px; color: #b8aa94; }
  .lado .qr div { width: 96px; height: 96px; background: #fff; border-radius: 12px; padding: 8px; flex: none; }
  .lado .qr svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<header class="demo">
  <a class="demo-marca" href="https://spacehost.cl" target="_blank" rel="noopener" aria-label="Spacehost">
    <img src="assets/spacehost.png" alt="Spacehost" width="141" height="18">
    <span class="demo-pill">DEMO</span>
  </a>
  <nav class="demo-botones" aria-label="Pantallas de la demo">
    <button class="demo-boton" data-pantalla="carta"><b>1</b><span><strong><span class="largo">Carta digital</span><span class="corto">Carta</span></strong><small>Disponibilidad y reservas</small></span></button>
    <button class="demo-boton" data-pantalla="admin-carta"><b>2</b><span><strong><span class="largo">Administrador de carta</span><span class="corto">Admin carta</span></strong><small>Agotados al instante</small></span></button>
    <button class="demo-boton" data-pantalla="pedidos"><b>3</b><span><strong><span class="largo">Pedido online</span><span class="corto">Pedido</span></strong><small>Delivery y retiro en vivo</small></span></button>
    <button class="demo-boton" data-pantalla="admin-pedidos"><b>4</b><span><strong><span class="largo">Administrador de pedidos</span><span class="corto">Admin pedidos</span></strong><small>Hora prometida y atrasos</small></span></button>
  </nav>
</header>

<main class="escena" id="escena">
  <aside class="lado" id="lado" aria-live="polite"></aside>
  <div class="telefono"><iframe id="pantalla" title="Pantalla de la demo"></iframe></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
  const BUHO = '<svg class="buho" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 9l6 5h12l6-5v15c0 7.7-5.4 12-12 12S8 31.7 8 24z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="15" cy="21" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="25" cy="21" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="15" cy="21" r="1.4" fill="currentColor"/><circle cx="25" cy="21" r="1.4" fill="currentColor"/><path d="M18.5 27l1.5 2 1.5-2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  const PANTALLAS = {
    carta: { url: 'carta.html', cliente: true, eti: 'Pantalla 1 · Cliente en el bar', titulo: 'Lo que hay hoy, sin sorpresas.', texto: 'El cliente escanea el QR y ve la carta de OWL BAR con lo que realmente queda: lo agotado aparece marcado con el motivo, no se descubre después.', puntos: ['Agotados visibles, con motivo y recomendación', 'Opciones con precio: punto, acompañamiento, gin', 'Reserva eligiendo barra, salón o terraza', 'Consultas directas por WhatsApp'], qr: 'carta.html' },
    'admin-carta': { url: 'admin-carta.html', cliente: false },
    pedidos: { url: 'pedidos.html', cliente: true, eti: 'Pantalla 3 · Pedido online', titulo: 'Nunca más «en preparación» por una hora.', texto: 'El cliente pide delivery o retiro, ve la hora prometida y cada cambio en vivo. Si el bar se atrasa o falta algo, se entera antes y decide él.', puntos: ['Tiempo de espera real antes de pedir', 'Hora prometida y cuenta regresiva', 'Aviso de atraso con nueva hora y motivo', 'Si falta un producto, el cliente elige: cambiar, quitar o cancelar', 'Evaluación después de la entrega'], qr: 'pedidos.html' },
    'admin-pedidos': { url: 'admin-pedidos.html', cliente: false },
  };
  const iframe = document.getElementById('pantalla');
  const escena = document.getElementById('escena');
  const lado = document.getElementById('lado');

  function qrSvg(texto) {
    if (!window.qrcode) return '';
    const q = qrcode(0, 'M'); q.addData(texto); q.make();
    return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  }

  function mostrar(nombre, extra = {}) {
    const p = PANTALLAS[nombre] ? nombre : 'carta';
    const d = PANTALLAS[p];
    let url = d.url;
    if (iframe.dataset.url !== url) { iframe.src = url; iframe.dataset.url = url; }
    escena.classList.toggle('cliente', d.cliente);
    document.querySelectorAll('.demo-boton').forEach((b) => {
      if (b.dataset.pantalla === p) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    lado.innerHTML = d.cliente ? `
      <span class="logo-owl">${BUHO}<span>OWL <em>BAR</em></span></span>
      <p class="eti">${d.eti}</p>
      <h1>${d.titulo}</h1>
      <p>${d.texto}</p>
      <ul>${d.puntos.map((x) => `<li>${x}</li>`).join('')}</ul>
      <div class="qr"><div>${qrSvg(new URL(d.qr, location.href).href)}</div><span>Escanéalo con tu celular para probarlo.</span></div>` : '';
    const hash = '#' + p;
    if (location.hash !== hash) history.replaceState(null, '', hash);
  }

  document.querySelectorAll('.demo-boton').forEach((b) => b.addEventListener('click', () => mostrar(b.dataset.pantalla)));
  addEventListener('message', (e) => {
    if (e.origin === location.origin && e.data?.demo === 'ir') mostrar(e.data.pantalla, { mesa: e.data.mesa });
  });
  const [, inicial, mesa] = location.hash.match(/^#([a-z-]+?)(?:-(\d+))?$/) || [];
  mostrar(inicial || 'carta', { mesa: Number(mesa) || undefined });
</script>
</body>
</html>
